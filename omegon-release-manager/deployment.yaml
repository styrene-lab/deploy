apiVersion: v1
kind: ServiceAccount
metadata:
  name: omegon-release-manager
  namespace: omegon-release-manager
  labels:
    app.kubernetes.io/name: omegon-release-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omegon-release-manager
  namespace: omegon-release-manager
  labels:
    app.kubernetes.io/name: omegon-release-manager
    app.kubernetes.io/part-of: styrene-public-agent-surface
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omegon-release-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omegon-release-manager
        app.kubernetes.io/part-of: styrene-public-agent-surface
    spec:
      serviceAccountName: omegon-release-manager
      containers:
        - name: omegon
          image: ghcr.io/styrene-lab/omegon:0.26.5
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/project
          args:
            - "serve"
            - "--control-port"
            - "7842"
            - "--strict-port"
            - "--agent"
            - "/agents/styrene.release-manager-agent"
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omegon-release-manager-secrets
                  key: GITHUB_TOKEN
            - name: VOX_DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omegon-release-manager-secrets
                  key: VOX_DISCORD_BOT_TOKEN
                  optional: true
            - name: VOX_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omegon-release-manager-secrets
                  key: VOX_SLACK_BOT_TOKEN
                  optional: true
            - name: VOX_SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omegon-release-manager-secrets
                  key: VOX_SLACK_APP_TOKEN
                  optional: true
            - name: MASTODON_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omegon-release-manager-secrets
                  key: MASTODON_ACCESS_TOKEN
                  optional: true
          ports:
            - containerPort: 7842
              name: control
          volumeMounts:
            - name: agent-config
              mountPath: /agents/styrene.release-manager-agent
              readOnly: true
            - name: workspace
              mountPath: /workspace/project
            - name: omegon-state
              mountPath: /root/.omegon
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/startup
              port: control
            initialDelaySeconds: 20
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 60
            periodSeconds: 60
      volumes:
        - name: agent-config
          configMap:
            name: omegon-release-manager-agent
        - name: workspace
          emptyDir: {}
        - name: omegon-state
          emptyDir: {}
