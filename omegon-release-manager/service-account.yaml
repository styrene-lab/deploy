# ServiceAccount used by Vault Secrets Operator Kubernetes auth for release-manager secret sync.
# The Auspex operator owns the actual OmegonAgent workload lifecycle.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-manager
  namespace: omegon-agents
  labels:
    app.kubernetes.io/name: omegon-release-manager
    app.kubernetes.io/part-of: styrene-public-agent-surface
---
# ServiceAccount used by the shared omegon-agents VaultAuth role for VSO secret sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omegon-agents
  namespace: omegon-agents
  labels:
    app.kubernetes.io/name: omegon-release-manager
    app.kubernetes.io/part-of: styrene-public-agent-surface
