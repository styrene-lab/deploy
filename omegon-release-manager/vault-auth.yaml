# Bridge from Vault/OpenBao into the Kubernetes Secret references used by the
# Auspex OmegonAgent. Provider auth and public connector credentials are kept
# in Vault and materialized by VSO; raw secrets are never committed here.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: release-manager-vault-auth
  namespace: omegon-agents
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/vault-connection
  kubernetes:
    role: omegon-release-manager
    serviceAccount: release-manager
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: release-manager-auth-json
  namespace: omegon-agents
spec:
  type: kv-v2
  mount: secret
  path: community/omegon-release-manager/auth-json
  refreshAfter: 1h
  vaultAuthRef: omegon-agents-vault-auth
  destination:
    name: release-manager-auth-json
    create: true
    labels:
      styrene.sh/secret-grant: release-manager-auth-json
      app.kubernetes.io/name: omegon-release-manager
    transformation:
      excludeRaw: true
      templates:
        auth.json:
          text: "{{ .Secrets.auth_json }}"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: release-manager-public-connectors
  namespace: omegon-agents
spec:
  type: kv-v2
  mount: secret
  path: community/omegon-release-manager/connectors
  refreshAfter: 1h
  vaultAuthRef: omegon-agents-vault-auth
  destination:
    name: release-manager-public-connectors
    create: true
    labels:
      styrene.sh/secret-grant: release-manager-public-connectors
      app.kubernetes.io/name: omegon-release-manager
    transformation:
      excludeRaw: true
      templates:
        github_token:
          text: "{{ .Secrets.github_token }}"
        discord_bot_token:
          text: "{{ .Secrets.discord_bot_token }}"
        slack_oauth_token:
          text: "{{ .Secrets.slack_oauth_token }}"
        slack_socket_token:
          text: "{{ .Secrets.slack_socket_token }}"
        mastodon_access_token:
          text: "{{ .Secrets.mastodon_access_token }}"
