# Cluster-internal control surface for supervisors; not publicly exposed.
apiVersion: v1
kind: Service
metadata:
  name: omegon-release-manager
  namespace: omegon-release-manager
  labels:
    app.kubernetes.io/name: omegon-release-manager
spec:
  selector:
    app.kubernetes.io/name: omegon-release-manager
  ports:
    - port: 7842
      targetPort: control
      name: control
  type: ClusterIP
