# GHCR pull credentials (styrene-docs Vault role)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: styrene-docs-vault-auth
  namespace: styrene-docs
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/vault-connection
  kubernetes:
    role: styrene-docs
    serviceAccount: styrene-docs
    tokenExpirationSeconds: 600
---
# OIDC client secret (scoped gateway-consumer role, primary Vanderlyn realm)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: envoy-gateway-vault-auth
  namespace: styrene-docs
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/vault-connection
  kubernetes:
    role: envoy-gateway-private-consumers
    serviceAccount: default
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: envoy-gateway-oidc-secret
  namespace: styrene-docs
spec:
  vaultAuthRef: envoy-gateway-vault-auth
  mount: secret
  type: kv-v2
  path: oidc/envoy-gateway
  destination:
    name: envoy-gateway-oidc-secret
    create: true
    transformation:
      excludeRaw: true
      templates:
        client-secret:
          text: "{{ .Secrets.client_secret }}"
  refreshAfter: 60s
