# ClusterIP for i2pd web console — monitoring only, not externally exposed
# Access via: kubectl port-forward -n styrene-i2p svc/i2pd-console 7070:7070
apiVersion: v1
kind: Service
metadata:
  name: i2pd-console
  namespace: styrene-i2p
  labels:
    app.kubernetes.io/name: styrene-i2p-gateway
spec:
  selector:
    app.kubernetes.io/name: styrene-i2p-gateway
  ports:
    - port: 7070
      targetPort: i2pd-console
      name: console
