apiVersion: v1
kind: ServiceAccount
metadata:
  name: styrene-i2p-gateway
  namespace: styrene-i2p
  labels:
    app.kubernetes.io/name: styrene-i2p-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: styrene-i2p-gateway
  namespace: styrene-i2p
  labels:
    app.kubernetes.io/name: styrene-i2p-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate    # PVC is ReadWriteOnce — can't share across pods
  selector:
    matchLabels:
      app.kubernetes.io/name: styrene-i2p-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: styrene-i2p-gateway
    spec:
      serviceAccountName: styrene-i2p-gateway
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: gateway
          image: ghcr.io/styrene-lab/styrene-i2p-gateway:sha-084594c299bc9e3ffffdbf111fdf751a1cc1a0b6
          imagePullPolicy: Always
          ports:
            - containerPort: 7070
              name: i2pd-console
          volumeMounts:
            - name: tunnel-keys
              mountPath: /var/lib/i2pd/tunnels
            - name: i2pd-data
              mountPath: /var/lib/i2pd/data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30

      volumes:
        - name: tunnel-keys
          persistentVolumeClaim:
            claimName: i2p-tunnel-keys
        - name: i2pd-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
